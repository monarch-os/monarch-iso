#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives
[options]
HoldPkg     = pacman glibc
Architecture = auto
NoProgressBar
ParallelDownloads = 5

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[offline]
# Packages are already covered by the ISO integrity manifest. pacstrap uses the
# live GpgDir, and signature verification here would race archiso's asynchronous
# pacman-init.service during unattended installs.
SigLevel = Never
Server = file:///var/cache/monarch/mirror/offline/
